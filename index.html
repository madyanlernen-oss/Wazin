<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>وازن - توازن حياتك بوعي</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="وازن - توازن حياتك بوعي" />
    <meta property="og:description" content="منصة وازن - توازن حياتك بوعي. إطار ذكي وشامل للتقييم والتطوير المتكامل لمجالات الحياة الثمانية." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:site_name" content="وازن" />
    <meta property="og:image" content="/assets/wazan_landing_page.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="وازن - توازن حياتك بوعي" />
    <meta name="twitter:description" content="منصة وازن - توازن حياتك بوعي. إطار ذكي وشامل للتقييم والتطوير المتكامل لمجالات الحياة الثمانية." />
    <meta name="twitter:image" content="/assets/wazan_landing_page.jpg" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/assets/wazan_logo.jpg" />
    <link rel="apple-touch-icon" href="/assets/wazan_logo.jpg" />

    <!-- Browser & OS Theme Color -->
    <meta name="theme-color" content="#0B6E72" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071318" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="وازن" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Typography (Google Fonts - Tajawal) with Preconnect & DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />

    <!-- Instant Theme Detection Script (Prevents Dark/Light Mode FOUC Flash) -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('wazan_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F8F7] dark:bg-[#071318] text-[#0F172A] dark:text-slate-100 antialiased font-['Tajawal',sans-serif] selection:bg-[#0B6E72]/20 selection:text-[#0B6E72] dark:selection:bg-cyan-500/25 dark:selection:text-cyan-300 min-h-screen transition-colors duration-300">
    <noscript>
      <div style="font-family: 'Tajawal', sans-serif; text-align: center; padding: 2.5rem 1rem; background-color: #071318; color: #F1F5F9; direction: rtl;">
        <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.75rem;">منصة وازن</h1>
        <p style="color: #94A3B8;">يتطلب هذا التطبيق تفعيل لغة JavaScript في المتصفح ليعمل بكامل وظائفه الذكية.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
