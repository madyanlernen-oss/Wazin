<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وزان - توازن حياتك بوعي</title>
    <meta name="description" content="موقع وزان - توازن حياتك بوعي. منصة ويب تفاعلية وذكية للتقييم والتطوير المتكامل لمجالات الحياة الثمانية." />
    
    <!-- الوسوم الاجتماعية لمشاركة رابط الموقع (واتساب، تويتر، لينكد إن) -->
    <meta property="og:title" content="وزان - توازن حياتك بوعي" />
    <meta property="og:description" content="منصة وزان - توازن حياتك بوعي. إطار ذكي وشامل للتقييم والتطوير المتكامل لمجالات الحياة الثمانية." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:site_name" content="موقع وزان" />
    <meta property="og:image" content="/assets/wazan_landing_page.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="وزان - توازن حياتك بوعي" />
    <meta name="twitter:description" content="منصة وزان - توازن حياتك بوعي. إطار ذكي وشامل للتقييم والتطوير المتكامل لمجالات الحياة الثمانية." />
    <meta name="twitter:image" content="/assets/wazan_landing_page.jpg" />

    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/jpeg" href="/assets/wazan_logo.jpg" />

    <!-- لون شريط المتصفح حسب نمط العرض (فاتح / داكن) -->
    <meta name="theme-color" content="#0B6E72" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071318" media="(prefers-color-scheme: dark)" />

    <!-- خط تجوال العربي مع تسريع التحميل المسبق -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />

    <!-- بيانات مهيكلة لموقع الويب (Google SEO Structured Data) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "وزان",
        "alternateName": "Wazan",
        "description": "منصة ويب تفاعلية وذكية لتقييم وتطوير مجالات الحياة الثمانية",
        "inLanguage": "ar"
      }
    </script>

    <!-- سكربت استشعار المظهر الفوري لمنع وميض الشاشة عند الفتح -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('wazan_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F8F7] dark:bg-[#071318] text-[#0F172A] dark:text-slate-100 antialiased font-['Tajawal',sans-serif] selection:bg-[#0B6E72]/20 selection:text-[#0B6E72] dark:selection:bg-cyan-500/25 dark:selection:text-cyan-300 min-h-screen transition-colors duration-300">
    <noscript>
      <div style="font-family: 'Tajawal', sans-serif; text-align: center; padding: 2.5rem 1rem; background-color: #071318; color: #F1F5F9; direction: rtl;">
        <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.75rem;">موقع وزان</h1>
        <p style="color: #94A3B8;">يتطلب تصفح هذا الموقع تفعيل لغة JavaScript في متصفحك ليعمل بكامل ميزاته التفاعلية.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
